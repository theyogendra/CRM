# Nginx sits in front of everything:
#  - load-balances /api across the API replicas (Docker DNS returns one address per replica)
#  - serves the built React app itself, with long-lived caching for fingerprinted assets
#  - a coarse per-IP request cap before traffic ever reaches Node

upstream api {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=per_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a replica that is down or restarting: retry the request on another one
        proxy_next_upstream error timeout http_502 http_503;
        proxy_read_timeout 90s;
        # which replica answered (handy when watching the balancing)
        add_header X-Upstream $upstream_addr always;
    }

    # Vite puts a content hash in every asset file name, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the SPA shell must always be revalidated so a deploy shows up straight away
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
